class Component extends DCLogic {

var squares = [];
for (var r = 8; r >= 1; r--) {
for (var f = 0; f < 8; f++) {
var id = files[f] + r;
var bg = (f + r) % 2 === 1 ? '#8FA58A' : '#F2EFEA';
var ring = 'none';
if (id === 'h5') { bg = 'rgba(233,69,53,0.55)'; ring = 'inset 0 0 0 6px #C9A45C'; }
if (id === 'g4') { bg = 'rgba(201,164,92,0.55)'; }
squares.push({ label: names[id] ? id + ', ' + names[id] : id, bg: bg, ring: ring });
}
}
return { squares: squares, files: files, ranks: ['8', '7', '6', '5', '4', '3', '2', '1'] };
}
}
