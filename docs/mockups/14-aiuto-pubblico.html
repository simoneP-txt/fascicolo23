<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Aiuto del pubblico</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Special+Elite&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2EFEA}a:hover{color:#C9A45C}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; box-sizing: border-box; background: #2B1D14; font-family: 'Cormorant Garamond', Georgia, serif; color: #1F1B17">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px">
<dc-import name="Biblioteca" hint-size="1920px,1080px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: rgba(31,27,23,0.82)"></div>

<div role="dialog" aria-label="Aiuto del pubblico" style="position: absolute; left: 576px; top: 192px; width: 768px; height: 688px; box-sizing: border-box; padding: 40px 64px; background-color: #F2EFEA; background-image: radial-gradient(rgba(31,27,23,0.06) 1px, transparent 1.5px); background-size: 8px 8px; border-radius: 16px; box-shadow: 0 32px 48px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 24px">
<div style="font-family: 'Special Elite', monospace; font-size: 24px; letter-spacing: 0.12em; color: #5C524A">AIUTO DEL PUBBLICO</div>
<div style="font-size: 56px; font-weight: 600; line-height: 1">Pubblico, tocca a voi?</div>
<div role="timer" aria-label="14 secondi rimasti" style="position: relative; width: 288px; height: 288px">
<svg aria-hidden="true" width="288" height="288" viewBox="0 0 288 288" style="position: absolute; left: 0; top: 0">
<circle cx="144" cy="144" r="128" fill="none" stroke="#1F1B17" style="stroke-width: 24; opacity: 0.12"></circle>
<circle cx="144" cy="144" r="128" fill="none" stroke="#E94535" stroke-dasharray="563 804" transform="rotate(-90 144 144)" style="stroke-width: 24; stroke-linecap: round"></circle>
</svg>
<div style="position: absolute; left: 0; top: 0; width: 288px; height: 288px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0px">
<div style="font-family: Anton, Impact, sans-serif; font-size: 128px; line-height: 1">14</div>
<div style="font-family: 'Special Elite', monospace; font-size: 20px; letter-spacing: 0.14em; color: #5C524A">SECONDI</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<span style="font-family: 'Special Elite', monospace; font-size: 20px; letter-spacing: 0.12em; color: #5C524A">GETTONI</span>
<span aria-label="gettone già usato" style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 50%; border: 4px dashed rgba(31,27,23,0.4); color: rgba(31,27,23,0.4); font-family: Anton, Impact, sans-serif; font-size: 40px; display: flex; align-items: center; justify-content: center">?</span>
<span aria-label="gettone in uso" style="width: 64px; height: 64px; border-radius: 50%; background: #E94535; box-shadow: 0 0 0 8px rgba(233,69,53,0.25); color: #F2EFEA; font-family: Anton, Impact, sans-serif; font-size: 40px; display: flex; align-items: center; justify-content: center">?</span>
<span aria-label="gettone rimasto" style="width: 64px; height: 64px; border-radius: 50%; background: #E94535; color: #F2EFEA; font-family: Anton, Impact, sans-serif; font-size: 40px; display: flex; align-items: center; justify-content: center">?</span>
</div>
<button type="button" style="width: 320px; height: 64px; box-sizing: border-box; background: transparent; border: 4px solid #1F1B17; border-radius: 8px; font-family: 'Special Elite', monospace; font-size: 28px; color: #1F1B17; cursor: pointer">Abbiamo finito?</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
