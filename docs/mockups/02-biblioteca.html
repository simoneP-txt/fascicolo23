<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
var palette = ['#5B3A29', '#2F4A3A', '#263A5A', '#B4863A', '#E9E1D2', '#4A2F45', '#5E6B4E', '#6B5B3E', '#1F3B3A', '#A39A86'];
var seed = 23;
var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
var files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
var rows = [];
for (var r = 8; r >= 1; r--) {
var cells = files.map(function (f) {
var n = 3 + Math.floor(rnd() * 2);
var spines = [];
for (var i = 0; i < n; i++) {
var h = 54 + Math.floor(rnd() * 26);
spines.push({
w: 13 + Math.floor(rnd() * 8),
h: h,
lift: Math.min(h + 6, 86),
color: palette[Math.floor(rnd() * palette.length)],
band: rnd() > 0.55 ? '#C9A45C' : 'transparent'
});
}
var coord = f + r;
return { coord: coord, spines: spines, hot: coord === 'd5', cold: coord !== 'd5', label: 'Scaffale ' + coord };
});
rows.push({ rank: String(r), cells: cells });
}
return { files: files, rows: rows };
}
}
</script>
